site_name: idfkit
repo_url: https://github.com/idfkit/idfkit
# One site for both languages (FR-051). Per-language sites, per-language navigation
# sections, and per-language addresses for shared material are prohibited: py.idfkit.com
# and js.idfkit.com redirect here permanently and no longer publish (FR-056).
site_url: https://developers.idfkit.com/
site_description: EnergyPlus IDF and epJSON tooling for Python and TypeScript. One API surface, one vocabulary, one site.
site_author: Samuel Letellier-Duchesne
edit_uri: edit/main/docs/
repo_name: idfkit/idfkit
copyright: Maintained by <a href="https://samuelduchesne.github.io">samuelduchesne</a>.

# The site is the four Diataxis kinds and nothing else.
#
# 001-FR-059 declared exactly one exception, `agent-references/`, for material addressed to
# automated tooling and shipped inside the Python wheel. Feature 003 retired it: the 16 topic
# pages are baked into the wheel and are no longer published, so the only thing left under
# that path is one explanation page about the skill, filed under Explanation like any other.
# A new exception requires amending the specification, not adding a line here.
exclude_docs: |
  tape/README.md
  # Build-time hooks, not pages. They live under docs/ so `hooks:` can find them
  # by a path relative to this file; they must not be copied into the site.
  hooks/
  # Same reasoning: `custom_templates:` and the pinned TypeDoc artifact are resolved relative to
  # this file, so they have to live under docs/ to survive the portable build, and neither is a
  # page. The 811 kB of TypeDoc JSON in particular has no business being served.
  templates/
  typedoc/

nav:
  - Home: index.md

  # Documentation is organised by the Diátaxis framework: Tutorials (learning),
  # How-to guides (tasks), Reference (facts), and Explanation (understanding).
  #
  # ONE navigation for both languages (FR-051). There is deliberately no Python
  # section and no TypeScript section: a page that teaches a task teaches it once,
  # and only the fenced code varies by language (FR-052). A page that applies to one
  # language only is filed by its kind like any other, and says so in its first line
  # rather than being quarantined into a language branch.

  - Tutorials:
    - tutorials/index.md
    - Build your first model: tutorials/first-model.md
    - Simulate an office block: tutorials/office-block.md
    - Core Tutorial: getting-started/core-tutorial.ipynb

  - How-to guides:
    - how-to/index.md
    - Common tasks: getting-started/quick-start.md
    - How to install idfkit: getting-started/installation.md
    - How to migrate from eppy: migration.md
    - Reading and editing models:
      - Collect diagnostics instead of throwing: how-to/collect-diagnostics.md
      - Save a file without reformatting it: how-to/preserve-formatting.md
      - Edit extensible groups: how-to/edit-extensible-groups.md
      - Compare two EnergyPlus versions: how-to/compare-versions.md
    - In the browser:
      - Parse in the browser: how-to/parse-in-the-browser.md
      - Run a simulation in the browser: how-to/run-a-simulation-in-the-browser.md
    - Working with simulations:
      - simulation/index.md
      - Run a simulation: simulation/running.md
      - Run simulations asynchronously: simulation/async.md
      - Access simulation results: simulation/results.md
      - Query SQL output: simulation/sql-queries.md
      - Run batch simulations: simulation/batch.md
      - Track simulation progress: simulation/progress.md
      - Cache simulation results: simulation/caching.md
      - Plot simulation results: simulation/plotting.md
      - Discover output variables: simulation/output-discovery.md
      - Handle simulation errors: simulation/errors.md
      - Migrate models between EnergyPlus versions: simulation/migrating-versions.md
      - Design-day sizing workflow: examples/sizing-workflow.ipynb
      - Run a parametric study: examples/parametric-study.ipynb
    - Weather data:
      - weather/index.md
      - Search for weather stations: weather/station-search.md
      - Download weather files: weather/downloads.md
      - Apply design days: weather/design-days.md
      - Geocode addresses: weather/geocoding.md
      - Warm the weather cache for an offline run: how-to/warm-the-weather-cache.md
    - Evaluate schedules: schedules/index.md
    - Scaling out:
      - Use cloud & remote storage: concepts/cloud-storage.md
      - Store simulation results in S3: examples/cloud-simulations.md
      - Run simulations as Celery tasks: examples/celery-integration.md
      - Run distributed simulations with Scythe: examples/scythe.md
    - Configuring & operating:
      - Configure logging: concepts/logging.md
      - Work across EnergyPlus versions: concepts/version-compatibility.md
    # Troubleshooting pages are how-to guides: each one is a task, taken in order,
    # by a reader who already knows what went wrong (FR-055, T107). They were a
    # top-level section, which made them a fifth kind by accident.
    - Troubleshooting:
      - Common errors: troubleshooting/errors.md
      - EnergyPlus issues: troubleshooting/energyplus.md

  - Reference:
    - reference/index.md
    - Supported EnergyPlus versions: reference/versions.md
    - Slim schema format: reference/slim-schema-format.md
    - Environment Variables: concepts/environment-variables.md
    - "CLI: idfkit tmy": cli/tmy.md
    # Generated from source by each language's own tooling (FR-061). The TypeScript
    # half arrives as a sibling of these subjects when its TypeDoc artefact is
    # published and pinned; it is not a second, language-named branch.
    - API Reference:
      - Core:
        - Document: api/document.md
        - Objects: api/objects.md
        - I/O: api/io.md
        - Schema: api/schema.md
        - Validation: api/validation.md
        - Geometry: api/geometry.md
        - Geometry Builders: api/geometry_builders.md
        - Surface Matching: api/surface_matching.md
        - Zoning: api/zoning.md
        - References: api/references.md
        - Thermal: api/thermal.md
        - Visualization: api/visualization.md
        - Exceptions: api/exceptions.md
        - Versions: api/versions.md
      - Simulation:
        - Overview: api/simulation/index.md
        - Runner: api/simulation/runner.md
        - Async: api/simulation/async.md
        - Preprocessing: api/simulation/expand.md
        - Results: api/simulation/results.md
        - SQL: api/simulation/sql.md
        - ESO / MTR: api/simulation/eso.md
        - Batch: api/simulation/batch.md
        - Cache: api/simulation/cache.md
        - Progress: api/simulation/progress.md
        - Plotting: api/simulation/plotting.md
        - File Systems: api/simulation/fs.md
      - Migration: api/migration.md
      - Schedules:
        - Overview: api/schedules/index.md
      - Weather:
        - Overview: api/weather/index.md
        - Station: api/weather/station.md
        - Download: api/weather/download.md
        - Design Days: api/weather/designday.md
      # The TypeScript half of the reference, generated by TypeDoc in idfkit-js and rendered
      # here from the pinned artifact. Grouped by npm package because that is how a reader
      # installs it, the same way the Python half is grouped by module. It is a subsection of
      # one API Reference, never a language branch of the site (FR-051).
      - TypeScript packages:
        - "@idfkit/core": reference/typescript/core.md
        - "@idfkit/core/node": reference/typescript/core-node.md
        - "@idfkit/schemas": reference/typescript/schemas.md
        - "@idfkit/weather": reference/typescript/weather.md
        - "@idfkit/weather/node": reference/typescript/weather-node.md

  - Explanation:
    - explanation/index.md
    - The hazards of a positional format: explanation/positional-format-hazards.md
    - Why field names come from epJSON: explanation/epjson-field-names.md
    - Two writers, one model: explanation/two-writers-one-model.md
    # Both generated from the pinned governance tag. They were reachable only by
    # direct link until now, which made a generated page that nothing navigates to.
    - Capability parity: explanation/parity.md
    - The naming map: explanation/naming-map.md
    - How conformance is established: explanation/conformance.md
    - Type-safe development: concepts/type-safety.md
    - Static types generated from the schema: explanation/generated-types.md
    - Why accessors and not a Proxy: explanation/accessors-not-proxies.md
    - Content-addressed schemas: explanation/content-addressed-schemas.md
    - A synchronous core with async edges: explanation/sync-core-async-edge.md
    - Browser simulation: explanation/browser-simulation.md
    - A language service for IDF text: explanation/idf-language-service.md
    - What is not finished: explanation/what-is-not-finished.md
    - Simulation architecture: concepts/simulation-architecture.md
    - Weather data pipeline: concepts/weather-pipeline.md
    - Caching strategy: concepts/caching.md
    - Geocoding & IP location: explanation/geocoding.md
    - How the schedule evaluator works: design/schedule-evaluator.md
    - Performance & benchmarks: benchmarks.md
    # One page about the agent skill, not the skill itself. The 16 topic references it
    # describes are baked into the wheel and are NOT published here, deliberately: the skill
    # loads the reference set baked into the idfkit version installed in the reader's project,
    # and a page can only ever show the one version this site pins. Publishing them made the
    # site copy the only one that could be wrong for a given reader, which is the drift the
    # skill exists to prevent. This is why there is no longer a fifth section.
    - Developing with an AI assistant: explanation/developing-with-an-ai-assistant.md

# Build-time substitution, not a plugin: `parity(id)` resolves against the pinned parity
# ledger and fails the build on an id that does not exist. A macros plugin would make Jinja of
# every `{{ ... }}` on every page, including the code samples; this touches one token.
hooks:
  - docs/hooks/parity_macro.py
  # Two jobs, both explained in the file. It reads the pinned TypeDoc artifact instead of
  # shelling out to `typedoc`, which is what lets this build render the TypeScript reference with
  # no Node toolchain (FR-058), and it patches griffe-typedoc, which cannot decode current TypeDoc
  # output unpatched. Both are documented workarounds with a stated end condition.
  - docs/hooks/typedoc_shim.py
  # Puts the three pinned levels into config.extra so every page can state them (FR-063).
  - docs/hooks/pinned_levels.py

plugins:
  - search
  - social
  - meta
  - tags
  - mkdocstrings:
      # Two handlers, one reference. Neither is a language-named branch of the site: a
      # TypeScript reference page is a sibling of the Python one under Reference, filed by kind
      # like everything else (FR-051, Principle IV). Both are generated from source and neither
      # is written by hand (Principle V).
      custom_templates: docs/templates
      handlers:
        typescript:
          options:
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
        python:
          # No `paths:` entry. griffe resolves `idfkit` from the installed distribution on
          # sys.path, at the exact version [tool.idfkit.library] pins, which is the only version
          # this repository can see: there is no src/ here to reach into. The Python reference is
          # still generated from source and never hand-written (Principle V); the source is now
          # inside a wheel rather than beside the pages.
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            # The API pages carry no hand-maintained `members:` allow-lists: they
            # silently dropped names that no longer existed and omitted real ones,
            # so the reference drifted from the code in both directions. Render
            # every public member instead, including dataclass fields documented
            # in a class-level Attributes: block rather than inline.
            filters: ["!^_"]
            show_if_no_docstring: true
  - mkdocs-jupyter:
      include_source: true
      execute: false
      include: ["*.ipynb"]

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    # Language tabs sync site-wide by label, which is what makes one choice of
    # "Python" or "TypeScript" hold across every page (FR-053). Its prerequisite,
    # pymdownx.tabbed with alternate_style, is set below.
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/fire

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/idfkit/idfkit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/idfkit
  generator: false

# The language shim (FR-053, FR-054). Reads ?language= and ?os= on load, activates the
# matching tab sets, and rewrites the parameter when the reader switches. Must stay a
# plain entry: it runs at end of body, after the tab markup and after Material has
# defined window.document$, which is the hook that survives instant navigation.
extra_javascript:
  - javascripts/tab-sync.js
  # The reader-initiated browser-simulation runner. It loads nothing until the button on the
  # browser-simulation how-to is pressed; the file's header says why that is a hard rule.
  - javascripts/engine-runner.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
