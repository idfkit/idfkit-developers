name: deploy-docs

# Publishes the unified site to developers.idfkit.com (001-FR-051).
#
# THE ARCHIVE GUARD THAT USED TO STAND HERE IS GONE, AND MUST NOT COME BACK.
#
# While this workflow lived in idfkit, it refused to run until an unexpired
# py.idfkit.com-last-full-build artefact existed. That was not ceremony: the deploy uses
# force_orphan, and in idfkit the branch it replaced held the last full build of
# py.idfkit.com, which could not be rebuilt from current sources.
#
# Here it replaces this repository's own gh-pages, which holds nothing but a previous build of
# this same site, reproducible from this same tree. There is nothing to retain. The guard would
# also never pass: it looked for the artefact under ${GITHUB_REPOSITORY}, and the archive lives
# in idfkit, beside archive-retired-site.yml, which stayed there because it answers for the
# retired host rather than for the site.
#
# IT DEPLOYS A RELEASE OF THIS REPOSITORY, NEVER A MERGE.
#
# Publishing is a decision, taken when a run of reviewed edits is ready to be read together, rather
# than a side effect of each merge. So the site publishes a `site-YYYY.N` release, cut from main, and
# never main as it happens to stand (scripts/site_release.py names the tag). This does NOT make
# main a safe place for a page that must not be read yet: any release publishes all of main, so such
# a page stays a draft until what it depends on has shipped. Three triggers, one tag each:
#
#   release             a maintainer published a release: `make release`.
#   workflow_call       release-on-level-change.yml cut one because a merge moved a pinned level.
#                       It calls this workflow rather than relying on the release event, because a
#                       release created with GITHUB_TOKEN triggers no workflow at all.
#   workflow_dispatch   re-publish without a change. Takes a tag; default the latest release.
#
# WHY NOT BY HAND ALONE. This workflow used to run only by hand, so what developers.idfkit.com
# served was whatever someone last remembered to publish. The first run of
# scripts/check_surfaces.py (feature 004) found the live site stating idfkit 1.0.0-rc.3 while this
# repository declared 1.0.0-rc.4: a page telling readers it describes a level the repository had
# already moved off (004-FR-030, SC-011). Release-gating does not bring that back, because a merge
# that moves a level releases itself (release-on-level-change.yml), and surfaces.yml checks daily
# that the served level is the declared one.
#
# A tag that is not on main is refused. Publishing a branch would put pages on the site that no
# review of main ever saw.
#
# One deploy at a time, and never cancelled: force_orphan replaces gh-pages whole, and a deploy
# interrupted between building and pushing would leave the previous build in place, which is
# safe, while two racing each other could leave the older one last. The concurrency group is on
# the job rather than the workflow, so that it also holds when the workflow is called.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The site-YYYY.N release to publish.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The site-YYYY.N release to publish. Leave empty for the latest release.
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - name: Resolve the release to publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if ! [[ "$tag" =~ ^site-[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a site-YYYY.N release. The site publishes releases of this repository, nothing else."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: The release is on main
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Cut site releases from main: make release."
            exit 1
          fi

      - name: The unreleased-library override is not set
        # 003-FR-023, the same assertion docs.yml makes. A published site built against a working
        # tree nobody can install would state a library level it was not built from.
        run: |
          if [ -n "${IDFKIT_LIBRARY_DIR:-}" ]; then
            echo "::error::IDFKIT_LIBRARY_DIR is set. The published site is built from the pin."
            exit 1
          fi

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Set up the parity ledger
        uses: ./.github/actions/setup-parity-ledger

      - name: Install Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Build documentation
        run: ./scripts/build_docs.sh

      - name: Preserve PR previews from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:pr-preview >/dev/null 2>&1; then
            git worktree add --detach gh-pages-ref gh-pages
            cp -r gh-pages-ref/pr-preview site/pr-preview
            git worktree remove gh-pages-ref
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          cname: developers.idfkit.com
