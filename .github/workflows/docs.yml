name: Docs

# The unified documentation site (FR-051, FR-057, FR-058, FR-084).
#
# The site teaches two libraries and is built from this repository alone. NOTHING HERE SETS UP A
# NODE TOOLCHAIN AND NOTHING HERE CHECKS OUT idfkit-js, and nothing may be added that does. The
# JavaScript reference reaches the site as a pinned, published artifact (research R8); a Node build
# step or a sibling checkout would make the site unbuildable from either repository alone, which is
# what 001-FR-058 and Principle V forbid. If a change to this file needs `setup-node`, the change
# is wrong, not the rule. The same now goes for `idfkit`: it arrives from the package index at the
# version [tool.idfkit.library] pins, and a checkout of it here would be the same mistake.
#
# Two jobs, and they are asking different questions:
#
#   strict    Does the site build, with every warning treated as an error?
#   portable  Does it still build from somewhere that is not this repository?
#
# `portable` was the gate that kept the move to idfkit/idfkit-developers a move rather than a
# rewrite. The move has happened, and the job keeps its name and its purpose even though "outside
# the repository" now means something weaker: this repository IS the documentation tree, so what
# the job proves is that the tree needs nothing beside it. That is still worth proving, because the
# failure it catches, a hook reaching sideways into scripts/, becomes EASIER to commit here, not
# harder. It copies docs/ and mkdocs.yml to a scratch directory outside the checkout and runs the
# same strict build there, against `idfkit` installed from the index rather than built from a
# sibling src/.
#
# A BUILD PREREQUISITE THAT IS EASY TO MISS. `docs/hooks/parity_macro.py` resolves every
# `{{ parity("id") }}` token against `governance/parity.toml` in idfkit/idfkit-conformance, read
# with `git show` at the immutable governance tag (FR-081). So a docs build now needs that
# repository checked out with its tags fetched, and a build without it fails rather than rendering
# from whatever happens to be on disk (FR-084). idfkit/idfkit-conformance is public, so
# `actions/checkout` needs no token for it.
#
# The tag is never restated in this file. It is read from `[tool.idfkit.governance] level` in
# pyproject.toml by the `pins` job below, the same way .github/workflows/conformance.yml reads it,
# because a restated pin is a pin that goes stale silently.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-register:
    # This repository is a consumer of idfkit, recorded as `idfkit-developers` in
    # governance/consumers.toml in idfkit-conformance (feature 004). The called workflow checks that
    # the register still describes this repository: its entry exists, both places the library level
    # is written (the pinned dependency and [tool.idfkit.library]) resolve and agree (FR-007), and
    # nothing here declares the library somewhere the register does not point (FR-006). It never
    # compares the level with what PyPI publishes; a consumer may be behind, and the sweep says so.
    #
    # The tag is written twice, on `uses:` and as the input, because a called workflow cannot see its
    # own ref. The called workflow refuses to run unless the two are identical, so they stay one
    # fact. It must match [tool.idfkit.governance] level in pyproject.toml; advance all three together.
    uses: idfkit/idfkit-conformance/.github/workflows/check-consumer.yml@governance-2026.18
    with:
      governance_level: governance-2026.18

  pins:
    name: pins
    runs-on: ubuntu-latest
    outputs:
      governance: ${{ steps.pin.outputs.governance }}
      conformance: ${{ steps.pin.outputs.conformance }}
      docs: ${{ steps.pin.outputs.docs }}
      library: ${{ steps.pin.outputs.library }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the pinned governance level
        id: pin
        # Only the governance level, because the parity ledger is the only shared artefact a docs
        # build reads. The conformance corpus level is conformance.yml's business. The runner image
        # ships Python 3.12, so tomllib is standard library and no environment setup is needed.
        run: |
          level=$(python3 - <<'PY'
          import pathlib
          import tomllib

          tool = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["idfkit"]
          print("governance=" + tool["governance"]["level"])
          # The other three are for the portable build, which has no pyproject.toml to read them
          # from. The site refuses to build without all four rather than render a page that
          # cannot say which levels it came from.
          print("conformance=" + tool["conformance"]["level"])
          print("docs=" + tool["docs"]["level"])
          print("library=" + tool["library"]["level"])
          PY
          )
          echo "$level"
          echo "$level" >> "$GITHUB_OUTPUT"

  js-snippets:
    name: the vendored TypeScript examples are the pinned ones
    runs-on: ubuntu-latest

    # 001-FR-084: an artefact is published and versioned before anything pins it. This job is what
    # says so out loud instead of letting a vendored copy pass for a released one; it was red on
    # every run the workflow had until docs-2026.1 was actually published from idfkit-js, which was
    # the point.
    #
    # Do not "fix" a red result by removing the pin, by allowing the sibling override here, or by
    # making it advisory. The vendored tree is a copy of another repository's published examples,
    # and a copy nobody compares is a copy that drifts.
    #
    # It reaches the network and the documentation build does not. That separation is deliberate:
    # 001-FR-058 keeps the build free of any dependency on idfkit-js, and this is not the build.
    steps:
      - name: The unreleased-library override is not set
        # 003-FR-023. IDFKIT_LIBRARY_DIR points a build at a working tree instead of the version
        # [tool.idfkit.library] pins. A build under it is not evidence about the declared level, so
        # a passing check here would mean nothing if it were set. Asserted rather than assumed,
        # because the whole value of a green check is what it lets a reader conclude.
        run: |
          if [ -n "${IDFKIT_LIBRARY_DIR:-}" ]; then
            echo "::error::IDFKIT_LIBRARY_DIR is set. CI builds the pinned release, never a checkout."
            exit 1
          fi
          echo "The unreleased-library override is unset, as it must be."

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Compare the vendored examples against the pinned release
        run: uv run python scripts/sync_js_artifacts.py --check

      - name: Every capability page declares the capability it describes
        # FR-047, SC-017. The parity macro renders availability where the reader is, and this is
        # what stops a page being added without one. It needs no network and no checkout, so it
        # runs here beside the drift check rather than in a job of its own.
        run: uv run python scripts/check_capability_declarations.py

  strict:
    name: strict build
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - name: The unreleased-library override is not set
        # 003-FR-023. IDFKIT_LIBRARY_DIR points a build at a working tree instead of the version
        # [tool.idfkit.library] pins. A build under it is not evidence about the declared level, so
        # a passing check here would mean nothing if it were set. Asserted rather than assumed,
        # because the whole value of a green check is what it lets a reader conclude.
        run: |
          if [ -n "${IDFKIT_LIBRARY_DIR:-}" ]; then
            echo "::error::IDFKIT_LIBRARY_DIR is set. CI builds the pinned release, never a checkout."
            exit 1
          fi
          echo "The unreleased-library override is unset, as it must be."

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        # .python-version pins 3.12 and this asks for it. The floor is 3.11 in any case:
        # docs/hooks/parity_ledger.py, and the hook and the render script that share it, read TOML
        # with tomllib, which is standard library only from 3.11. This repository has no obligation
        # to run on 3.10, which is why the library's four-way matrix did not follow the site here.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Check out the conformance repository at the pinned governance level
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: ${{ needs.pins.outputs.governance }}
          path: conformance
          # Full history and tags: the parity macro reads the ledger with `git show <tag>:...`
          # rather than from the working tree, so the tag has to resolve inside the checkout.
          fetch-depth: 0

      - name: Install Cairo
        # mkdocs-material's `social` plugin renders preview cards through cairosvg, which needs the
        # native library. Same step as deploy-docs.yml and main.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Copy the four weather-browser files out of the installed library
        # They are part of the library's distribution and part of a page. They reached the page by
        # symlink into src/ until 003-T018; now they are copied, because a symlink does not survive
        # the repository boundary this site is about to cross. A missing one fails the build rather
        # than publishing a page with a broken widget.
        run: uv run python scripts/copy_shipped_assets.py

      - name: Build the site, warnings are failures
        env:
          # Where the ledger's repository is. The tag still comes from pyproject.toml and the read
          # is still `git show <tag>:governance/parity.toml`. IDFKIT_GOVERNANCE_DIR, which would
          # read a working tree instead of the tag, is NOT set here and must never be: a green run
          # under that override is not evidence about the pinned tag (FR-084).
          IDFKIT_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: uv run mkdocs build --strict

      - name: The site hosts no engine bytes and fetches none before a reader asks
        # FR-072, SC-027. After the build, because it measures the built site. The browser
        # simulation pages document 51 MB of WebAssembly and embed a runner that executes it;
        # everything it needs comes from a CDN on activation. Both ways that stops being true
        # are quiet: a copied binary, and a preload hint that costs nothing in this repository
        # and 51 MB in every reader's tab.
        run: uv run python scripts/check_engine_assets.py site

  portable:
    name: portable build (outside the repository)
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - name: The unreleased-library override is not set
        # 003-FR-023. IDFKIT_LIBRARY_DIR points a build at a working tree instead of the version
        # [tool.idfkit.library] pins. A build under it is not evidence about the declared level, so
        # a passing check here would mean nothing if it were set. Asserted rather than assumed,
        # because the whole value of a green check is what it lets a reader conclude.
        run: |
          if [ -n "${IDFKIT_LIBRARY_DIR:-}" ]; then
            echo "::error::IDFKIT_LIBRARY_DIR is set. CI builds the pinned release, never a checkout."
            exit 1
          fi
          echo "The unreleased-library override is unset, as it must be."

      - name: Choose a scratch directory outside the checkout
        # Outside $GITHUB_WORKSPACE on purpose. A scratch directory inside the checkout would let a
        # relative path escape the documentation tree and still resolve, which is the one thing this
        # job exists to catch.
        #
        # Set here rather than in a job-level `env:` block, where this lived until it was found to
        # have never run. The `runner` context is not available to `jobs.<id>.env`, so
        # `${{ runner.temp }}` there is not an empty string but a workflow the parser rejects
        # outright: every job in this file, not just this one, failed to start. A startup failure
        # creates no check runs, so `gh pr checks` reported green while `strict`, `portable`,
        # `js-snippets` and `pins` had never executed once. $RUNNER_TEMP is the same directory,
        # reached through a default environment variable that a `run:` step does have.
        run: echo "SCRATCH=$RUNNER_TEMP/docs-portability" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Check out the conformance repository at the pinned governance level
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: ${{ needs.pins.outputs.governance }}
          path: conformance
          fetch-depth: 0

      - name: Install Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Export the pinned documentation toolchain
        # The same MkDocs, Material, mkdocstrings and griffe versions the `strict` job resolves,
        # taken from uv.lock, so a difference between the two builds is attributable to the
        # location and not to a plugin that moved underneath them.
        #
        # There is no `uv build` step above this any more. Before the move this job built a wheel
        # out of the library's own src/ so the site would render from a distribution rather than
        # from a source tree, exercising the extracted arrangement one release early. That
        # arrangement is now simply the arrangement: `idfkit` is a pinned dependency in
        # pyproject.toml, uv.lock resolves it at the version [tool.idfkit.library] names, and the
        # export below carries it like any other.
        #
        # No --only-group: that restricts the export to the dev group, and `idfkit` is a project
        # dependency, not a dev one. Exporting only the dev group produced a scratch environment
        # with the whole documentation toolchain and no library in it, and the build failed on
        # `import idfkit` after everything else had succeeded. --no-emit-project drops only this
        # repository itself, which is a virtual project with nothing to install.
        run: uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/docs-toolchain.txt"

      - name: Copy the documentation tree to the scratch directory
        # docs/ carried five committed symlinks whose targets lived outside it, and `cp -RL`
        # materialised them so the pages that used them still rendered here. 003-T018 and T019
        # removed all five: the terminal recordings under tape/ are real content under docs/ now,
        # and the weather browser's four files are copied out of the installed distribution by the
        # step below. The listing must therefore print nothing, and -L is kept only so that a
        # reintroduced symlink is visible in the log rather than silently broken.
        #
        # Build wiring gets no such treatment: an `--8<--` include, a hooks: path or a custom_dir
        # that leaves the documentation tree has nothing to resolve against here and fails the
        # build below.
        run: |
          mkdir -p "$SCRATCH"
          echo "Committed symlinks under docs/ whose target leaves the documentation tree:"
          git ls-files -s docs \
            | awk '$1 == "120000" { print $4 }' \
            | while read -r link; do printf '  %s -> %s\n' "$link" "$(readlink "$link")"; done
          cp -RL docs "$SCRATCH/docs"
          cp mkdocs.yml "$SCRATCH/mkdocs.yml"

      - name: No documentation file computes a path out of its own location
        # Nothing is copied alongside the tree above, and nothing may need to be. The scratch build
        # below gets docs/ and mkdocs.yml, exactly what the eventual idfkit/idfkit-developers
        # repository will hold, and it has to succeed on that alone.
        #
        # This step used to carry one named exception: docs/hooks/parity_macro.py imported
        # scripts/render_parity_page.py through `Path(__file__).resolve().parents[2]`, so the hook
        # mkdocs.yml lists did not survive being copied on its own, and the two files it needed were
        # copied in after it. The ledger model now lives in docs/hooks/parity_ledger.py and the
        # render script imports down into it, so the exception is gone and the expected set below is
        # empty (T172, research R7).
        #
        # Keep it empty. A file under docs/ that walks up out of its own directory is the coupling
        # this whole job exists to reject, and the answer is to restructure it the way the parity
        # hook was restructured, never to copy its target in here.
        #
        # HOW FAR IS TOO FAR DEPENDS ON THE FILE. This was a fixed grep for `parents[` or
        # `.parent.parent`, which is not the rule it meant to enforce, and on the first run this
        # workflow ever completed it rejected compliant code: docs/hooks/typedoc_shim.py reaches
        # `.parent.parent` to address docs/typedoc/typedoc.json, which is one level UP to docs/ and
        # then back down, never leaving the tree. That file's own comment states the real rule, that
        # `parents[2]` would be the escape. One pattern cannot express it, because a file at
        # docs/a/b/f.py may walk one level further than a file at docs/hooks/f.py before it is out.
        # So measure per file rather than matching a shape.
        run: |
          set -euo pipefail
          python3 - <<'GUARD'
          import pathlib
          import re
          import sys

          docs = pathlib.Path("docs")
          # `.parent` chains, not counting the `.parents[` accessor that merely starts the same way.
          chain = re.compile(r"(?:\.parent\b(?!s))+")
          indexed = re.compile(r"\.parents\[\s*(\d+)\s*\]")
          findings = []

          for path in sorted(docs.rglob("*.py")):
              # Directory levels between docs/ and this file. A file may take that many steps up,
              # plus one to stand on docs/ itself. One more and it is outside the tree.
              levels = len(path.relative_to(docs).parts) - 1
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), start=1):
                  if line.lstrip().startswith("#"):
                      continue
                  for match in chain.finditer(line):
                      steps = match.group(0).count(".parent")
                      if steps > levels + 1:
                          findings.append((path, number, match.group(0).strip(), steps, levels + 1))
                  for match in indexed.finditer(line):
                      steps = int(match.group(1)) + 1
                      if steps > levels + 1:
                          findings.append((path, number, match.group(0).strip(), steps, levels + 1))

          if findings:
              print("::error::A documentation file computes a path out of its own location:")
              for path, number, snippet, steps, allowed in findings:
                  print(f"::error::  {path}:{number}  {snippet} walks {steps} up, {allowed} stays inside docs/")
              print("::error::The documentation tree has to build where this repository is not, so it")
              print("::error::cannot reach into it. Move what the file needs under docs/, and import")
              print("::error::that from the repository side, the way scripts/render_parity_page.py")
              print("::error::imports docs/hooks/parity_ledger.py.")
              sys.exit(1)

          print("No file under docs/ reaches outside the documentation tree.")
          GUARD

      - name: Install the toolchain and idfkit outside the repository
        run: |
          uv venv "$SCRATCH/.venv" --python 3.12
          uv pip install --python "$SCRATCH/.venv/bin/python" -r "$RUNNER_TEMP/docs-toolchain.txt"
          "$SCRATCH/.venv/bin/python" -c 'import idfkit; print("idfkit resolved from", idfkit.__file__)'

      - name: Copy the four weather-browser files into the scratch tree
        # From the wheel-installed idfkit in the scratch venv, not from this checkout: the whole
        # point of this job is that the scratch tree is what idfkit-developers will hold, and that
        # repository has no src/ to reach into. This is the step that replaces `cp -RL` for these
        # four files.
        run: |
          "$SCRATCH/.venv/bin/python" scripts/copy_shipped_assets.py \
            --destination "$SCRATCH/docs/weather/browse"

      - name: Build the site from the scratch directory, warnings are failures
        env:
          # mkdocstrings' Python handler carries no `paths:` entry: griffe finds `idfkit` on
          # sys.path in the scratch environment and the reference renders from the installed
          # distribution. The `paths: ["src"]` line the library needed was deleted with the move.
          #
          # The variables below are the documented overrides for a build that is not sitting in the
          # repository. The levels are still the ones pyproject.toml pins, passed down from the
          # `pins` job rather than restated; the ledger is still read at its tag with `git show`.
          # IDFKIT_GOVERNANCE_DIR, which would read a working tree instead of the tag, stays unset
          # here and must never be set: a green run under it is not evidence about the pin.
          IDFKIT_GOVERNANCE_LEVEL: ${{ needs.pins.outputs.governance }}
          IDFKIT_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
          # These come from pyproject.toml in the `strict` build, which runs inside the repository.
          # Here there is no pyproject.toml, on purpose: the scratch tree is docs/ and mkdocs.yml
          # and nothing else, which is the whole claim this job tests.
          IDFKIT_CONFORMANCE_LEVEL: ${{ needs.pins.outputs.conformance }}
          IDFKIT_DOCS_LEVEL: ${{ needs.pins.outputs.docs }}
          IDFKIT_LIBRARY_LEVEL: ${{ needs.pins.outputs.library }}
        run: |
          cd "$SCRATCH"
          "$SCRATCH/.venv/bin/mkdocs" build --strict
