
# One environment, not the library's four.
#
# idfkit matrixes 3.10 through 3.13 because it must run on all of them. This repository is built
# by CI on exactly one interpreter and has no consumer on the other three, so a four-way matrix
# would quadruple a build to prove nothing. The floor is 3.11 in any case: docs/hooks/
# pinned_levels.py and docs/hooks/parity_ledger.py read TOML with the standard-library tomllib.
#
# The scaffold is kept for shape and familiarity; only its matrix collapses.

[tox]
skipsdist = true
envlist = py312

[gh-actions]
python =
    3.12: py312

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = uv
commands =
    uv sync --python {envpython}
    uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml
    pyright
